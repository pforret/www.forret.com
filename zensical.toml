# generated by pforret/mkdox2 v2.2.1

[project]
# hand-tuned: site identity (see CLAUDE.md, "Hand-tuned settings")
site_name = "Peter Forret"
site_url = "https://www.forret.com/"
site_description = "Tech consultant and entrepreneur — founder of DCProof and toolstud.io"
site_author = "Peter Forret"
# no repo_url/repo_name: the header must not show the pforret/www.forret.com repo link (user request)
copyright = "© 2004–2026 Peter Forret"
# hand-tuned: vintage editorial look (palette, fonts, cards, rules) — inspired by designmd.app/library/vintage-editorial
extra_css = ["stylesheets/extra.css"]
# hand-tuned: tab order (no awesome-pages: .pages files are ignored); every top-level section must be listed
nav = [
  { "Home" = "index.md" },
  { "Portfolio" = [
    "portfolio/index.md",
    "portfolio/dcproof.md",
    "portfolio/toolstudio.md",
    "portfolio/bashew.md",
    "portfolio/opensource.md",
  ] },
  { "About" = [
    "about/index.md",
    "about/cv.md",
    "about/timeline.md",
  ] },
  { "Blog" = "blog/index.md" },
  # tags.md is deliberately not in the menu (still built, reachable via tag links)
]
# hand-tuned: keep internal folders out of the published site/ (gitignore-style, relative to docs/)
exclude_docs = """
/todo/
"""

[project.theme]
name = "material"
logo = "icon/android-chrome-192x192.png"
favicon = "icon/android-chrome-192x192.png"
custom_dir = "docs/overrides"
# hand-tuned: portfolio-style layout (header always visible, TOC on the right, section index pages)
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

# hand-tuned: custom colours (cream/ink/warm brown) defined in docs/stylesheets/extra.css; light/dark toggle following the OS
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.theme.font]
text = "Fraunces"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown.extensions]
admonition = {}
abbr = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}

[project.markdown.extensions.toc]
permalink = true

[project.markdown.extensions."pymdownx.caret"]
[project.markdown.extensions."pymdownx.critic"]
[project.markdown.extensions."pymdownx.details"]
[project.markdown.extensions."pymdownx.keys"]
[project.markdown.extensions."pymdownx.mark"]
[project.markdown.extensions."pymdownx.snippets"]
[project.markdown.extensions."pymdownx.tilde"]

[project.markdown.extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown.extensions."pymdownx.tasklist"]
custom_checkbox = true

[project.markdown.extensions."pymdownx.emoji"]
emoji_index = "material.extensions.emoji.twemoji"
emoji_generator = "material.extensions.emoji.to_svg"

[project.markdown.extensions."pymdownx.superfences"]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.plugins.search]

# llms.txt index + Markdown copies of the pages listed below (for AI readers)
[project.plugins.llmstxt]
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Docs" = ["index.md", "about/*.md"]
"Portfolio" = ["portfolio/*.md"]
"Blog" = ["blog/posts/*.md"]

# tags in page front matter; listed on docs/tags.md (<!-- material/tags -->)
[project.plugins.tags]

# click to enlarge images
[project.plugins.glightbox]

# self-host Google Fonts and the lightbox assets (downloaded at first build, cached in .cache/)
# other external assets (mermaid, video player, ...) stay remote: add patterns here to self-host them too
[project.plugins.privacy]
assets_include = ["fonts.googleapis.com/*", "fonts.gstatic.com/*", "unpkg.com/glightbox@*"]

[project.plugins.minify]
minify_html = true
minify_inline_js = true
minify_inline_css = true

# social cards + Open Graph tags (uses site_url)
[project.plugins.social]

# Obsidian-style callouts: > [!NOTE]
[project.plugins.callouts]

[project.plugins.blog]
blog_dir = "blog"
post_url_date_format = "yyyy/MM"
post_date_format = "medium"

[project.plugins.rss]
match_path = "blog/posts/.*"
json_feed_enabled = false
use_git = false

[project.plugins.rss.date_from_meta]
as_creation = "date"
as_update = "date"

[project.extra]
generator = false

# hand-tuned: Simple Analytics (cookieless, no consent banner); script in docs/overrides/partials/integrations/analytics/custom.html
[project.extra.analytics]
provider = "custom"

# hand-tuned: footer social links
[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/peterforret/"
name = "LinkedIn"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pforret"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/solid/blog"
link = "https://blog.forret.com/"
name = "Blog"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://twitter.com/pforret"
name = "X / Twitter"

[[project.extra.social]]
icon = "fontawesome/brands/youtube"
link = "https://www.youtube.com/@PeterForret"
name = "YouTube"
